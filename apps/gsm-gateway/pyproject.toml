[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "syrotp-gsm-gateway"
version = "0.1.0"
description = "SYROTP gateway for USB GSM modems (SIM800/SIM900/Quectel/Huawei). Reads inbound SMS, signs each one with HMAC-SHA256, and forwards to an SYROTP server."
readme = "README.md"
requires-python = ">=3.10"
# SYROTP Core License v1.0 — source-available, NOT OSI-approved.
# Full text in the local LICENSE file (a copy of LICENSE-SYROTP-CORE).
# This package is the SYROTP USB-modem inbound SMS gateway and is part
# of the SYROTP "core" — see the repository root LICENSE for the full
# Open Core split.
license = { file = "LICENSE" }
authors = [{ name = "Muhammed Sheko (SYR-ROOT)" }]
keywords = ["otp", "sms", "gsm", "gateway", "syrotp"]
# License classifier intentionally omitted: SYROTP Core License is
# source-available, not OSI-approved, so no `License :: OSI ...`
# classifier applies.
classifiers = [
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Communications :: Telephony",
]
dependencies = [
  "pyserial>=3.5",
  "httpx>=0.27",
  "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
]

[project.scripts]
syrotp-gateway = "syrotp_gateway.__main__:main"

[tool.setuptools.packages.find]
include = ["syrotp_gateway*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
