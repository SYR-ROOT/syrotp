[build-system]
# setuptools 77+ enables PEP 639 (SPDX `license`/`license-files`).
# Older setuptools fails with the new SPDX-string form below.
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "syrotp-sdk"
version = "0.1.0"
description = "Official Python SDK for the Syrian Reverse OTP Protocol (SYROTP). Sync + async client, typed errors, retry policy matched to the cross-language SDK contract."
readme = "README.md"
requires-python = ">=3.10"
# PEP 639: SPDX expression instead of the legacy `{ text = "..." }` form.
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Muhammed Sheko (SYR-ROOT)" }]
keywords = ["otp", "sms", "verification", "syrotp", "reverse-otp", "sdk", "async", "fastapi", "django"]
# PEP 639 supersedes license classifiers with the SPDX `license` field
# above. setuptools 77+ rejects the combination of SPDX `license` and a
# `License :: OSI Approved :: ...` classifier — the SPDX expression is
# now the canonical metadata.
classifiers = [
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Communications",
  "Intended Audience :: Developers",
]
dependencies = [
  "httpx>=0.27",
]

[project.optional-dependencies]
fastapi = [
  "fastapi>=0.110",
  "pydantic-settings>=2",
]
django = [
  "django>=4.2",
]
dev = [
  "build>=1.2",
  "twine>=5.0",
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
  "pytest-django>=4.8",
  "fastapi>=0.110",
  "pydantic-settings>=2",
  "django>=4.2",
]

[project.urls]
Homepage = "https://github.com/SYR-ROOT/syrotp"
Documentation = "https://github.com/SYR-ROOT/syrotp/blob/main/docs/sdk-contract.md"
Source = "https://github.com/SYR-ROOT/syrotp/tree/main/packages/sdk-python"
Issues = "https://github.com/SYR-ROOT/syrotp/issues"
Changelog = "https://github.com/SYR-ROOT/syrotp/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["syrotp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
